name: image

# Builds the slimmed agentes image and pushes it to GHCR so the self-host
# machine only pulls — no local builds, no build cache eating its disk.
on:
  push:
    branches: [dev]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tea-gift/agentes-chat:dev
            ghcr.io/tea-gift/agentes-chat:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The GHCR package is private and the host's token can't read packages,
      # so the deployable copy travels as a workflow artifact: the host runs
      # `gh run download` and `docker load`.
      - name: Export image as artifact
        run: |
          docker save ghcr.io/tea-gift/agentes-chat:dev-${{ github.sha }} | gzip > agentes-image.tar.gz
          ls -lh agentes-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: agentes-image
          path: agentes-image.tar.gz
          retention-days: 7
